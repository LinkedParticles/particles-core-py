# Publish the linkedparticles-core distribution to PyPI.
#
# This repo is a per-release scrubbed export of a private development upstream
# (see CONTRIBUTING.md). These workflows are authored in that upstream under
# publish/overlays/ and laid into the exported tree by the release export —
# edit them there, not on the public repo (a direct edit here is overwritten by
# the next export).
#
# Supply-chain convention (matches the upstream): every `uses:` is pinned to a
# full 40-char commit SHA, never a mutable `@vN` tag; the trailing `# vN`
# comment is the human-readable tag that SHA resolves to. Bump a SHA only
# deliberately.
#
# Authentication is PyPI Trusted Publishing (OIDC): no API token is stored in
# this repo. A short-lived, upload-scoped credential is minted from the job's
# id-token and is bound on PyPI to exactly this repository + this workflow
# filename + the `pypi` environment — so the trusted-publisher entry on PyPI
# must name `publish.yml` and the `pypi` environment. The environment carries
# no required reviewer, by the owner's ruling of 2026-10-22; its deployment
# policy admits only branch `main` and tags `v*`, so no other ref can run a job
# in it (RELEASING.md § One-time setup).
#
# Only the `publish` job runs in that environment, and it installs nothing:
# the build and the SBOM, which resolve code from an index, run in jobs with
# no OIDC identity, so no package an index serves can run where it could
# mint an upload credential (security review D3).
#
# The files are bound to the build job by digest, not by artifact name: the
# build job publishes the SHA-256 of every file it made as a job output, and
# each later job downloads the build's artifact by id and checks those
# digests before it uploads or attests anything. Code from an index runs in
# the SBOM job between the upload and the attestation, and a job output is
# the one thing it cannot rewrite.
#
# Trigger: publishing a GitHub Release (which also cuts the tag). The
# workflow_dispatch path is a manual re-run or a TestPyPI rehearsal, and runs
# only from `main`.
#
# This is the CORE distribution — the dependency of the engine distribution. It
# must reach the index BEFORE the engine is published, or a
# `pip install linkedparticles` cannot resolve its exactly-pinned core. The
# engine repo's publish workflow refuses to upload until this core version is
# resolvable from the index.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Index to publish to"
        type: choice
        options: [pypi, testpypi]
        default: pypi

permissions:
  contents: read

# Never let two publishes of the same ref race; queue rather than cancel, so a
# cancelled run can never abandon a half-built upload.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that resolves code from an index runs here, in a job that holds
  # no credential: the build backend. The upload job receives only the files
  # this job built.
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      cutoff: ${{ steps.ver.outputs.cutoff }}
      dist-id: ${{ steps.dist.outputs.artifact-id }}
      dist-sha256: ${{ steps.digests.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Code from an index runs in this job; leave it no token on disk.
          persist-credentials: false

      # `version` pins the uv binary that runs the build, so the tool that
      # writes the uploaded files is a tested one rather than whatever was
      # newest at run time.
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          python-version: "3.11"
          enable-cache: false

      # The version is stamped into pyproject.toml by the release export; read
      # it once and reuse it for the SBOM filename. It is checked against a
      # plain version shape before it becomes an output, because later steps
      # put it in file names and commands. The cutoff is the instant this run
      # began resolving: the SBOM closure resolves nothing newer.
      - name: Read the release version
        id: ver
        run: |
          set -euo pipefail
          v="$(sed -nE 's/^version = "(.+)"$/\1/p' pyproject.toml | head -1)"
          [ -n "$v" ] || { echo "could not read version from pyproject.toml" >&2; exit 1; }
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*$ ]]; then
            echo "pyproject.toml version is not a release version" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "cutoff=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Publishing linkedparticles-core $v"

      # The build backend is pinned exactly and hash-checked: hatchling and
      # its dependencies come from `.github/build-constraints.txt`, so a new
      # release of any of them cannot reach the files this job writes.
      - name: Build sdist and wheel
        run: uv build --build-constraints .github/build-constraints.txt --require-hashes

      # The digests of exactly the files built above, as a job output: the
      # publish and provenance jobs check what they download against these.
      - name: Record the distribution digests
        id: digests
        run: |
          set -euo pipefail
          echo "sha256=$(cd dist && sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum -- *)

      - name: Hand the distributions to the upload job
        id: dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The only job that holds the Trusted Publishing identity. It checks nothing
  # out, installs nothing and runs no build: it downloads the files the build
  # job made and hands them to the upload action. Every other job is
  # credential-free or, for the provenance job, installs nothing (security
  # review D3).
  publish:
    name: publish
    needs: build
    # A release runs on its tag; a dispatch runs only from `main`. The
    # environment's deployment policy says the same on the repository side.
    if: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # The environment binds the trusted-publisher identity.
    environment: pypi
    permissions:
      id-token: write # mint the OIDC token for Trusted Publishing
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.dist-id }}
          merge-multiple: true
          path: dist/

      - name: Check the distributions against the build digests
        env:
          DIST_SHA256: ${{ needs.build.outputs.dist-sha256 }}
        run: |
          set -euo pipefail
          sums="$RUNNER_TEMP/dist.sha256"
          printf '%s' "$DIST_SHA256" | base64 -d > "$sums"
          (cd dist && sha256sum --check --strict "$sums")
          diff <(cd dist && ls -A | sort) <(sed -E 's/^[0-9a-f]{64} [ *]//' "$sums" | sort)

      # skip-existing makes a re-run idempotent: PyPI is immutable, so a
      # filename that already landed is a no-op rather than a hard error, which
      # is what makes recovering from a partial failure a plain re-run.
      - name: Publish to PyPI (Trusted Publishing)
        if: ${{ github.event_name == 'release' || inputs.repository == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          # PEP 740 digital attestations, minted from the same Trusted
          # Publishing identity. This is the action's default under OIDC and
          # has been in effect since the first publish; it is pinned here so
          # the posture is a decision in the file rather than an inherited
          # default that an action bump could change.
          attestations: true

      - name: Publish to TestPyPI (rehearsal)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: true

  # ---- Supply-chain artifacts ------------------------------------------ #
  # Everything below runs AFTER the upload, deliberately. The PyPI publish is
  # irreversible and burns a version on failure; an SBOM step placed before it
  # would turn a cosmetic tooling break into a blocked release. Each job here
  # describes an artifact that already exists.
  #
  # The SBOM installs the wheel's resolved closure, which is code from an
  # index, so it runs read-only: no OIDC identity and no write token. The
  # job that writes to the Release holds both and installs nothing.
  sbom:
    name: sbom
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sbom-id: ${{ steps.sbom.outputs.artifact-id }}
    steps:
      # For pyproject.toml only, which names the SBOM's root component.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Code from an index runs in this job; leave it no token on disk.
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          python-version: "3.11"
          enable-cache: false

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.dist-id }}
          merge-multiple: true
          path: dist/

      # `UV_EXCLUDE_NEWER` holds the closure and the SBOM tool to what the
      # index served when the build began, so a package released during the
      # run cannot join it.
      - name: Generate the CycloneDX SBOM
        env:
          v: ${{ needs.build.outputs.version }}
          UV_EXCLUDE_NEWER: ${{ needs.build.outputs.cutoff }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          out="sbom/linkedparticles-core-${v}.cdx.json"
          # A clean environment holding exactly the built wheel and its
          # resolved closure. `uv venv` seeds no pip/setuptools, so nothing
          # outside the artifact's own dependency graph lands in the SBOM.
          # The closure is resolved from the index, which is what a consumer
          # of this version actually receives — the development lockfile in
          # the private upstream describes a resolution nobody installs.
          uv venv /tmp/sbom-env
          # The closure resolves from PyPI alone, a TestPyPI rehearsal
          # included: the wheel under test is the local file, and TestPyPI
          # is open registration, so it never supplies a dependency. Under
          # `--extra-index-url` a squatted name there would outrank the real
          # one on PyPI (security review D3).
          uv pip install --python /tmp/sbom-env/bin/python \
            --index-url https://pypi.org/simple/ dist/*.whl
          # `--pyproject` names the root component from the tree's own
          # metadata, so the document is about this distribution rather than
          # about an anonymous virtualenv. `--output-reproducible` drops the
          # timestamp and random serial, so re-running produces byte-identical
          # output.
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment \
            /tmp/sbom-env/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --output-file "$out"
          echo "Wrote $out ($(wc -c < "$out") bytes)"

      - name: Hand the SBOM to the provenance job
        id: sbom
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 7

  # Sigstore identity and Release write access, so this job installs nothing:
  # it attests and uploads files the jobs above produced, using only the
  # pinned attest action and the runner's own `gh`.
  provenance:
    name: provenance and Release assets
    needs: [build, sbom]
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` uploads the SBOM and the provenance bundle to the
      # Release, `id-token: write` is the sigstore identity of the provenance
      # statement, and `attestations: write` records it. None of it can
      # publish to PyPI: the trusted publisher there names the `pypi`
      # environment, which this job does not run in.
      contents: write
      id-token: write
      attestations: write
    steps:
      # By artifact id, and then by digest: code from an index ran in the SBOM
      # job, which this one follows, so the files are checked against what
      # the build job recorded before anything is attested.
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.dist-id }}
          merge-multiple: true
          path: dist/

      - name: Check the distributions against the build digests
        env:
          DIST_SHA256: ${{ needs.build.outputs.dist-sha256 }}
        run: |
          set -euo pipefail
          sums="$RUNNER_TEMP/dist.sha256"
          printf '%s' "$DIST_SHA256" | base64 -d > "$sums"
          (cd dist && sha256sum --check --strict "$sums")
          diff <(cd dist && ls -A | sort) <(sed -E 's/^[0-9a-f]{64} [ *]//' "$sums" | sort)

      - name: Download the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sbom.outputs.sbom-id }}
          merge-multiple: true
          path: sbom/

      # A sigstore-backed SLSA provenance statement over the published files
      # and over the SBOM itself, verifiable with `gh attestation verify`.
      # The PyPI upload carries its own PEP 740 attestations; this is what
      # covers the Release assets, which those do not reach.
      - name: Attest build provenance (distributions + SBOM)
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            sbom/linkedparticles-core-${{ needs.build.outputs.version }}.cdx.json

      # The SBOM lives on the Release, not on PyPI, which accepts no side
      # files. It is written under `sbom/` rather than `dist/` on purpose: a
      # re-run of this workflow hands `dist/*` to the upload action, which
      # rejects anything that is not a distribution.
      - name: Attach the SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "sbom/linkedparticles-core-$VERSION.cdx.json" \
            --repo "$GITHUB_REPOSITORY" --clobber

      # The provenance bundle on the Release too, beside the files it attests.
      # The statement above lands in the attestation store, which a verifier
      # without API access cannot reach and which OpenSSF Scorecard's
      # Signed-Releases check does not read: that check looks at Release
      # assets only. The bundle holds one sigstore bundle per line, each
      # wrapping the in-toto statement, so it carries the `.intoto.jsonl`
      # name Scorecard credits as provenance, and
      # `gh attestation verify <file> --bundle <asset> --owner LinkedParticles`
      # checks a download against it. Like the SBOM it runs after the
      # irreversible upload, and a failure here is reported without failing
      # the run, so a missing asset can never hold back the steps after it.
      - name: Attach the provenance bundle to the GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p provenance
          out="provenance/linkedparticles-core-$VERSION.intoto.jsonl"
          cp "$BUNDLE" "$out"
          gh release upload "$TAG" "$out" \
            --repo "$GITHUB_REPOSITORY" --clobber
