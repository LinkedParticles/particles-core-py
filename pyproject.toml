# Build configuration for the `linkedparticles-core` distribution — the Client
# layer of the Particles reference implementation.
#
# `linkedparticles-core` and `linkedparticles` ship code under the SAME import
# package, `particles`, split along the Client/Engine boundary. Exactly one
# distribution owns each path: this one owns `particles/__init__.py`,
# `particles/py.typed`, and the `__init__.py` of the two straddling packages
# (`particles/render/`, `particles/interchange/`), because it is the dependency
# and is therefore always present when the engine is. Each of those files calls
# `pkgutil.extend_path`, which is what lets the engine's modules resolve even
# when the two distributions land in different `sys.path` roots.
#
# The wheels must have ZERO file overlap. If you add a file here that the
# engine also ships, the two installs overwrite each other and uninstalling
# either breaks the other.
#
# `version` and the engine's dependency pin are stamped from the development
# upstream at export time — the two distributions always share one exact
# version and advance together.
[project]
name = "linkedparticles-core"
version = "1.139.0"
description = "Store-free client library for Particles: define, validate, serialize, and extract provenance-tracked belief particles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Particles authors" }]
keywords = [
    "epistemic", "knowledge-management", "provenance", "uncertainty", "psum",
    "knowledge-graph", "beliefs", "llm", "agents", "rag", "citations",
    "agent-memory", "json-ld", "shacl", "jsonschema",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The Client layer's own runtime closure — every third-party package imported
# by a module in this distribution. It is a subset of the engine's, never a
# superset: installing the engine installs this, so a package needed by both
# is declared in both and resolved once.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=0.28",
    "numpy>=1.26",
    "scipy>=1.13",
    "sentence-transformers>=2.7",
    # Declared explicitly *only* so `[tool.uv.sources]` below can route it to
    # the CPU-only wheel index — uv sources apply to a project's direct
    # dependencies, and torch is otherwise transitive via
    # sentence-transformers. Deliberately unbounded: sentence-transformers
    # still decides which torch we get, this line only decides which *build*.
    "torch",
    # The extraction layer types its session parameters against SQLAlchemy's
    # async session; the import is executed at module load even though no
    # Client module opens a connection. Declared so a store-free install still
    # imports.
    "sqlalchemy>=2.0",
    # JSON-LD / RDF / SHACL parsing stack — these handle attacker-influenced
    # input (interchange import, conformance validation), so they carry tested
    # next-breaking upper bounds in addition to the floor: a future breaking
    # major of any of them must be vetted before adoption rather than pulled in
    # silently by a downstream `pip install`.
    "pyld>=2.0,<4",
    "pyshacl>=0.26,<0.32",
    "rdflib>=7.0,<8",
    "jsonschema>=4.22",
    # Deposited PDFs are attacker-influenced input on the runtime path, so this
    # floor (CVE-2026-71852 / CVE-2026-71870, fixed in 6.15.0) is a direct
    # dependency floor rather than an environment constraint.
    "pypdf>=6.15.0",
    "html2text>=2024.2",
    "lxml-stubs>=0.5.1",
    # Observability API only: a small, pure-Python, no-op-by-default package.
    # With no SDK provider installed it returns no-op tracers, so the spans
    # Client modules emit cost nothing. The SDK / exporters / auto-
    # instrumentation ride the engine distribution's `otel` extra.
    "opentelemetry-api>=1.27",
]

[project.optional-dependencies]
# Opt-in vision/multimodal extraction. Installs the PDF rasterizer used to
# render image-bearing pages for a vision-capable provider. pypdfium2 is
# pip-installable with no system binaries and a permissive license. The general
# extractor imports it lazily and raises an actionable ImportError when vision
# extraction is enabled without it, so the base install stays lean.
vision = [
    "pypdfium2>=4.30",
]

# PyPI renders these beside the description and maps the recognized names
# (Homepage / Documentation / Repository / Issues / Changelog) to icons. Both
# sites are live and are the front of this project, so they lead. There is no
# CHANGELOG.md in a published tree — the per-release notes ride the GitHub
# Release — so "Changelog" points at the releases page.
[project.urls]
Homepage = "https://linkedparticles.org"
Documentation = "https://docs.linkedparticles.org"
Repository = "https://github.com/LinkedParticles/particles-core-py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["particles"]

# Ship the normative schema artifacts (JSON Schema, JSON-LD context, the five
# SHACL shapes) inside the wheel so a `pip install` carries them. Without this
# the conformance validator and the JSON-LD context loader resolve to a path
# that only exists in a source checkout, and validation silently no-ops for
# installed users. They land under `particles/_artifacts/schemas/` and are
# resolved as packaged resources; the source-tree `artifacts/schemas/` remains
# the checkout fallback. The graph assets and the Alembic migrations are the
# engine's to ship — every force-include belongs to exactly one distribution.
[tool.hatch.build.targets.wheel.force-include]
"artifacts/schemas" = "particles/_artifacts/schemas"
# The Conformance Profile artifact, for the same reason and by the same
# mechanism: `profile.yaml` was resolved relative to the repo root, which does
# not exist for an installed distribution, so every installed caller of the
# profile raised FileNotFoundError. `particles/conformance` is Client-layer, so
# this force-include belongs here even though the conformance runner is invoked
# from an engine surface.
"artifacts/conformance/profile.yaml" = "particles/_artifacts/conformance/profile.yaml"
"artifacts/conformance/similarity_vectors.json" = "particles/_artifacts/conformance/similarity_vectors.json"

# Allowlist only what a source build / install needs. The hatch default sweeps
# the whole repo into the sdist; keep this an explicit include, not an exclude,
# so a file added at the repo root never ships by accident.
[tool.hatch.build.targets.sdist]
only-include = [
    "particles",
    "artifacts/schemas",
    "artifacts/conformance",
    "tests",
    "constraints.txt",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires ANTHROPIC_API_KEY",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # Typer uses function calls in defaults by design
    "B904",  # raise typer.Exit() in except is CLI control flow
]

# `particles` is this repo's own package even though part of it is installed
# from a sibling distribution. Without this, isolated ruff sorts the
# cross-distribution imports into the third-party block and every module in the
# tree reports I001.
[tool.ruff.lint.isort]
known-first-party = ["particles"]

# Torch: the CPU-only build on every platform that has a choice.
#
# `sentence-transformers` pulls `torch`, and PyPI's default Linux/Windows torch
# wheel declares the whole CUDA runtime as hard dependencies — 43 `nvidia-*`
# packages plus `triton`, several gigabytes. This SDK never touches a GPU:
# torch is used only for `all-MiniLM-L6-v2` inference, and no code path imports
# torch directly. Every one of those gigabytes is unreachable weight, and a
# stock CI runner has no room for them.
#
# `explicit = true` means the index is used *only* for packages routed to it
# here, so nothing else in the closure silently resolves off PyPI. macOS is
# excluded because PyPI's Darwin wheel is already CPU-only and the CPU index
# publishes no Darwin wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

# Security floors on packages that are not direct dependencies — they arrive
# transitively, so a floor here raises the minimum without adding a spurious
# direct dependency. Revisit each line once the parent's own floor moves past
# the fixed version.
[tool.uv]
constraint-dependencies = [
    "idna>=3.15",         # CVE-2026-45409, runtime hostname path
    "setuptools>=83.0.0", # PYSEC-2026-3447, build path (pulled in by torch)
]

# What `pytest` needs and nothing more. The suite in this repository is the
# store-free half, so it has no database, no HTTP server, and no LLM: the
# Anthropic client and the embedding encoder are mocked through their explicit
# seams.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "hypothesis>=6.152.4",
]
